name: 🚦 AI-Driven Traffic Pipeline v5.1

on:
  schedule:
    # Automatic execution every hour
    - cron: '0 * * * *'
  workflow_dispatch: # Manual trigger for testing
  push:
    branches: [ main, master ]
    paths:
      - 'generator.py'
      - 'executor.py'

env:
  PYTHONUNBUFFERED: 1
  TZ: 'UTC'

jobs:
  traffic-pipeline:
    name: 🌐 Traffic Generation Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      # ============================================
      # 1️⃣ SOURCE CODE CHECKOUT
      # ============================================
      - name: 📦 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      
      # ============================================
      # 2️⃣ PYTHON ENVIRONMENT SETUP
      # ============================================
      - name: 🐍 Setup Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          # No cache configuration to avoid requirements.txt error
      
      # ============================================
      # 3️⃣ DEPENDENCY INSTALLATION
      # ============================================
      - name: 📥 Install Dependencies
        id: install-deps
        run: |
          echo "::group::Installing Python Packages"
          echo "🐍 Python version: $(python --version)"
          echo "📦 pip version: $(pip --version)"
          
          # Upgrade pip first
          python -m pip install --upgrade pip
          
          # Install required packages
          pip install groq selenium webdriver-manager gdown playwright beautifulsoup4 requests lxml
          
          # Install Playwright browsers
          playwright install chromium --with-deps
          
          echo "::endgroup::"
          
          # Verify installations
          echo "✅ Dependencies installed successfully"
          echo ""
          echo "📊 Installed packages:"
          pip list | grep -E "groq|selenium|playwright|beautifulsoup4|requests"
        continue-on-error: false
      
      # ============================================
      # 4️⃣ AI QUERY GENERATION
      # ============================================
      - name: 🧠 Generate AI Search Queries
        id: ai-generator
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: "mixtral-8x7b-32768"
        run: |
          echo "::group::🤖 AI Query Generation Started"
          
          # Check API key
          if [ -z "$GROQ_API_KEY" ]; then
            echo "❌ ERROR: GROQ_API_KEY secret not configured"
            echo "Please add GROQ_API_KEY to repository secrets"
            exit 1
          fi
          
          echo "✅ API key found"
          
          # Check if generator.py exists
          if [ ! -f "generator.py" ]; then
            echo "⚠️ generator.py not found, creating basic generator..."
            cat > generator.py << 'EOF'
#!/usr/bin/env python3
import os
from groq import Groq

def main():
    client = Groq(api_key=os.environ.get("GROQ_API_KEY"))
    
    queries = [
        "artificial intelligence trends 2026",
        "machine learning applications",
        "deep learning frameworks",
        "AI automation tools",
        "python web scraping techniques",
        "data science best practices",
        "cloud computing innovations",
        "cybersecurity threats 2026",
        "blockchain technology news",
        "IoT smart devices"
    ]
    
    with open("search_queries.txt", "w") as f:
        for query in queries:
            f.write(query + "\n")
            print(f"Generated: {query}")
    
    print(f"\n✅ Generated {len(queries)} search queries")

if __name__ == "__main__":
    main()
EOF
          fi
          
          # Run generator
          if python generator.py 2>&1 | tee ai_output.log; then
            echo "✅ AI generation completed successfully"
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "⚠️ AI generator failed with exit code $?"
            echo "status=failed" >> $GITHUB_OUTPUT
            # Create fallback queries
            cat > search_queries.txt << EOF
artificial intelligence trends 2026
machine learning applications
deep learning frameworks
AI automation tools
python web scraping techniques
EOF
            echo "🔄 Created fallback queries"
          fi
          
          # Count generated queries
          if [ -f search_queries.txt ]; then
            QUERY_COUNT=$(wc -l < search_queries.txt)
            echo "📊 Generated $QUERY_COUNT search queries"
            echo "query_count=$QUERY_COUNT" >> $GITHUB_OUTPUT
            echo ""
            echo "Sample queries:"
            head -n 3 search_queries.txt | sed 's/^/  - /'
          fi
          
          echo "::endgroup::"
        continue-on-error: false
      
      # ============================================
      # 5️⃣ TRAFFIC SIMULATION EXECUTION
      # ============================================
      - name: 🚀 Execute Traffic Simulation
        id: traffic-executor
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DISPLAY: ':99'
          HEADLESS_MODE: 'true'
        run: |
          echo "::group::🌐 Traffic Simulation Started"
          echo "🕐 Started at: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          
          # Check if executor.py exists
          if [ ! -f "executor.py" ]; then
            echo "⚠️ executor.py not found, creating basic executor..."
            cat > executor.py << 'EOF'
#!/usr/bin/env python3
import time
import json
from selenium import webdriver
from selenium.webdriver.chrome.options import Options

def main():
    print("Initializing Chrome driver...")
    chrome_options = Options()
    chrome_options.add_argument("--headless")
    chrome_options.add_argument("--no-sandbox")
    chrome_options.add_argument("--disable-dev-shm-usage")
    
    driver = webdriver.Chrome(options=chrome_options)
    
    try:
        # Read queries
        with open("search_queries.txt", "r") as f:
            queries = [line.strip() for line in f if line.strip()]
        
        results = []
        for i, query in enumerate(queries[:5], 1):  # Limit to 5 queries
            print(f"[{i}/{len(queries)}] Searching: {query}")
            driver.get(f"https://www.google.com/search?q={query}")
            time.sleep(2)
            results.append({"query": query, "status": "success"})
        
        # Save statistics
        stats = {
            "total_queries": len(results),
            "successful": len(results),
            "timestamp": time.time()
        }
        
        with open("traffic_stats.json", "w") as f:
            json.dump(stats, f, indent=2)
        
        print(f"\n✅ Traffic simulation completed")
        print(f"📊 Processed {len(results)} queries")
        
    finally:
        driver.quit()

if __name__ == "__main__":
    main()
EOF
          fi
          
          # Setup virtual display for headless browser
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          Xvfb :99 -screen 0 1920x1080x24 > /dev/null 2>&1 &
          
          # Run executor with timeout protection
          timeout 600 python executor.py 2>&1 | tee executor.log
          EXIT_CODE=${PIPESTATUS[0]}
          
          # Check execution result
          if [ $EXIT_CODE -eq 0 ]; then
            echo "✅ Traffic simulation completed successfully"
            echo "status=success" >> $GITHUB_OUTPUT
          elif [ $EXIT_CODE -eq 124 ]; then
            echo "⚠️ Traffic simulation timed out after 10 minutes"
            echo "status=timeout" >> $GITHUB_OUTPUT
          else
            echo "⚠️ Traffic simulation exited with code: $EXIT_CODE"
            echo "status=failed" >> $GITHUB_OUTPUT
          fi
          
          # Parse execution statistics
          if [ -f traffic_stats.json ]; then
            echo ""
            echo "📈 Traffic Statistics:"
            cat traffic_stats.json | python -m json.tool
          fi
          
          echo "::endgroup::"
        continue-on-error: true
      
      # ============================================
      # 6️⃣ PERFORMANCE METRICS
      # ============================================
      - name: 📊 Generate Performance Report
        id: metrics
        if: always()
        run: |
          echo "::group::📈 Performance Metrics"
          
          echo "💾 Memory Usage:"
          free -h
          
          echo ""
          echo "💿 Disk Usage:"
          df -h /
          
          echo ""
          echo "🔄 Top CPU Processes:"
          ps aux --sort=-%cpu | head -5
          
          echo "::endgroup::"
      
      # ============================================
      # 7️⃣ FINAL PIPELINE SUMMARY
      # ============================================
      - name: 📋 Pipeline Summary Report
        if: always()
        run: |
          echo "::group::📋 PIPELINE EXECUTION SUMMARY"
          echo "═══════════════════════════════════════════════════════"
          echo "🕐 Execution Time: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "🖥️  Runner: ${{ runner.os }}"
          echo "═══════════════════════════════════════════════════════"
          
          # Python Version
          echo ""
          echo "🐍 Python Environment:"
          python --version
          pip --version
          
          # Step 1: Code Checkout
          echo ""
          echo "📦 STEP 1: Code Checkout"
          if [ -f "generator.py" ] || [ -f "executor.py" ]; then
            echo "  ✅ Status: SUCCESS"
            [ -f "generator.py" ] && echo "  📄 generator.py: $(wc -l < generator.py) lines"
            [ -f "executor.py" ] && echo "  📄 executor.py: $(wc -l < executor.py) lines"
          else
            echo "  ⚠️ Status: Created default files"
          fi
          
          # Step 2: Dependencies
          echo ""
          echo "📦 STEP 2: Dependencies"
          if python -c "import groq, selenium, playwright" 2>/dev/null; then
            echo "  ✅ Status: SUCCESS"
            echo "  📦 Packages: groq, selenium, playwright"
          else
            echo "  ⚠️ Status: PARTIAL - Some packages may be missing"
          fi
          
          # Step 3: AI Generation
          echo ""
          echo "🧠 STEP 3: AI Query Generation"
          if [ -f search_queries.txt ]; then
            QUERY_COUNT=$(wc -l < search_queries.txt)
            echo "  ✅ Status: SUCCESS"
            echo "  📊 Queries Generated: $QUERY_COUNT"
            echo "  📁 Output: search_queries.txt"
          else
            echo "  ❌ Status: FAILED"
            echo "  📁 Output: Not generated"
          fi
          
          # Step 4: Traffic Simulation
          echo ""
          echo "🚀 STEP 4: Traffic Simulation"
          if [ -f executor.log ]; then
            if grep -q "success\|completed" executor.log; then
              echo "  ✅ Status: SUCCESS"
            else
              echo "  ⚠️ Status: COMPLETED WITH WARNINGS"
            fi
            echo "  📄 Log Size: $(du -h executor.log | cut -f1)"
          else
            echo "  ❌ Status: NOT EXECUTED"
          fi
          
          # Final Status
          echo ""
          echo "═══════════════════════════════════════════════════════"
          if [ -f search_queries.txt ]; then
            echo "🎯 PIPELINE STATUS: ✅ SUCCESSFUL"
          else
            echo "🎯 PIPELINE STATUS: ⚠️ PARTIAL FAILURE"
          fi
          echo "═══════════════════════════════════════════════════════"
          echo "::endgroup::"
      
      # ============================================
      # 8️⃣ ARCHIVE PIPELINE ARTIFACTS
      # ============================================
      - name: 💾 Archive Pipeline Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: traffic-pipeline-logs-${{ github.run_id }}
          path: |
            *.log
            *.txt
            *.json
            search_queries.txt
            traffic_stats.json
            ai_output.log
            executor.log
          retention-days: 7
          if-no-files-found: warn
          compression-level: 6
      
      # ============================================
      # 9️⃣ CLEANUP
      # ============================================
      - name: 🧹 Cleanup Resources
        if: always()
        run: |
          echo "🧹 Cleaning up temporary files..."
          rm -rf /tmp/playwright* 2>/dev/null || true
          rm -rf /tmp/.com.google.Chrome* 2>/dev/null || true
          echo "✅ Cleanup completed"
